# Run with `uv run prek run --all-files` (or `prek install` for the git hook).
# Local hooks so the versions are the ones pinned in the dev dependency group;
# --locked makes a hook fail rather than resolve or change dependencies.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format
        language: system
        types_or: [python, pyi]
      - id: ty
        name: ty check
        entry: uv run --locked ty check
        language: system
        pass_filenames: false
      - id: pyrefly
        name: pyrefly check
        entry: uv run --locked pyrefly check
        language: system
        pass_filenames: false
