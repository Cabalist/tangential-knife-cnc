# Run with `uv run prek run --all-files` (or `prek install` for the git hook).
# Local hooks so the versions are the ones pinned in the dev dependency group.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      - id: ty
        name: ty check
        entry: uv run ty check
        language: system
        pass_filenames: false
      - id: pyrefly
        name: pyrefly check
        entry: uv run pyrefly check
        language: system
        pass_filenames: false
