name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run ruff format --check .
      - run: uv run ruff check src tests stubs
      - run: uv run ty check
      - run: uv run pyrefly check
      - run: uv run pytest
      - run: uv build
      - name: Install the built wheel into a clean environment and run it
        run: |
          uv venv --python 3.14 /tmp/wheel-venv
          uv pip install --python /tmp/wheel-venv/bin/python dist/*.whl
          /tmp/wheel-venv/bin/tcnc tests/files/square.svg -o /tmp/square.ngc --overcut 1
          grep -q '^M2' /tmp/square.ngc
