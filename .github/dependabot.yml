# Dependabot version updates. Version updates start as soon as this file is on
# the default branch; security updates are a repository setting
# (Settings > Code security > Dependabot).
version: 2
updates:
  # The actions the workflows pin (checkout, setup-uv, Pages, artifacts, publishing).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Everything locked in uv.lock: the runtime dependencies (the geometry
  # kernel and svgelements) in one group, the development and docs tools in
  # another.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      runtime:
        patterns: ["tangential-knife-cnc-geometry", "svgelements"]
      tooling:
        patterns: ["*"]
