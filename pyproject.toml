[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "utl-tcnc"
version = "1.0.0"
description = "SVG to LinuxCNC G-code for an oscillating tangential knife"
readme = "README.md"
requires-python = ">=3.14"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Ryan Jarvis", email = "ryan@technoloft.com" }]
maintainers = [{ name = "Ryan Jarvis", email = "ryan@technoloft.com" }]
keywords = ["svg", "gcode", "cnc", "tangential knife", "linuxcnc"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
# Upstream: utlco/utl-tcnc by Claude Zervas (LGPL-3.0). Rewritten 2026-09.
dependencies = [
    "utl-geom2d>=1.0.0",
    "svgelements>=1.9",
]

[dependency-groups]
dev = [
    "prek",
    "pyrefly",
    "pytest",
    "pytest-randomly",
    "pytest-xdist",
    "ruff",
    "ty",
]

[project.scripts]
tcnc = "tcnc.cli:main"

[project.urls]
Repository = "https://github.com/Cabalist/utl-tcnc"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tcnc*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
"tcnc" = ["py.typed"]

[tool.uv.sources]
# Local sibling checkout while geom2d 1.0.0 is untagged and unpublished.
# Switch to { git = "https://github.com/Cabalist/utl-geom2d.git", tag = "v1.0.0" }
# once the tag exists; CI cannot resolve the relative path.
utl-geom2d = { path = "../utl-geom2d", editable = true }

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "ANN",
    "RUF",
    "PTH",
    "PIE",
    "PERF",
    "PGH",
    "G",
    "TID",
    "PT",
    "RET",
    "ARG",
    "TRY",
    "PL",
    "DTZ",
    "T20",
    "ISC",
    "TC",
]
ignore = [
    "E501",    # line too long (handled by formatter)
    "PERF401",
    "PERF403",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917", # established APIs and callback/fixture signatures accept positional arguments
    "PLR2004",
    "TRY003",
]
per-file-ignores = { "tests/**" = ["ANN", "PLR2004", "ARG001"], "stubs/**" = ["ANN401", "I001"] }

[tool.ruff.lint.isort]
known-first-party = ["tcnc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-n", "auto", "--dist=loadscope", "-ra"]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.environment]
python-version = "3.14"
# "." resolves the `tests` package so shared test helpers import as `tests.*`.
root = ["./src", "."]
# svgelements ships ISO-8859-1 source the checkers cannot read; stubs/ declares what tcnc uses.
extra-paths = ["stubs"]

[tool.ty.rules]
missing-type-argument = "error"
possibly-missing-attribute = "error"
possibly-missing-import = "error"
possibly-unresolved-reference = "error"
redundant-cast = "error"
unused-ignore-comment = "error"
unused-type-ignore-comment = "error"

[[tool.ty.overrides]]
include = ["tests/**"]
rules = { unresolved-attribute = "ignore" }

[tool.pyrefly]
min-severity = "warn"
project-includes = ["src", "tests"]
python-version = "3.14"
search-path = ["src", "stubs", "."]
preset = "strict"

[tool.pyrefly.errors]
redundant-cast = "error"
# Every hit is a `key=lambda` passed to sorted/min/max over a typed
# iterable. Pyrefly 1.2 does not solve the lambda's parameter from the
# sibling iterable argument, so it reports the idiom itself; ty infers and
# checks the same lambdas. Re-enable once pyrefly solves generic key callables.
implicit-any-lambda = "ignore"

[[tool.pyrefly.sub-config]]
matches = "tests/**/*"

[tool.pyrefly.sub-config.errors]
implicit-any-empty-container = "ignore"
implicit-any-parameter = "ignore"
implicit-any-type-argument = "ignore"
missing-attribute = "ignore"
