[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tangential-knife-cnc"
version = "1.0.0"
description = "SVG to LinuxCNC G-code for an oscillating tangential knife"
readme = "README.md"
requires-python = ">=3.14"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Ryan Jarvis", email = "ryan@technoloft.com" }]
maintainers = [{ name = "Ryan Jarvis", email = "ryan@technoloft.com" }]
keywords = ["svg", "gcode", "cnc", "tangential knife", "linuxcnc"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
# Upstream: utlco/utl-tcnc by Claude Zervas (LGPL-3.0). Rewritten 2026-09.
dependencies = [
    "tangential-knife-cnc-geometry>=1.0.0",
    "svgelements==1.9.6",  # pinned: its 3.14 behaviour and the stubs in stubs/ are tested against this version
]

[dependency-groups]
dev = [
    "prek",
    "pyrefly",
    "pytest",
    "pytest-randomly",
    "pytest-xdist",
    "ruff",
    "ty",
]

[project.scripts]
tcnc = "tcnc.cli:main"

[project.urls]
Repository = "https://github.com/Cabalist/tangential-knife-cnc"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tcnc*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
"tcnc" = ["py.typed"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "ANN",
    "RUF",
    "PTH",
    "PIE",
    "PERF",
    "PGH",
    "G",
    "TID",
    "PT",
    "RET",
    "ARG",
    "TRY",
    "PL",
    "DTZ",
    "T20",
    "ISC",
    "TC",
    "FBT",    # booleans are keyword-only by convention
    "C90",    # mccabe complexity
    "SLF",    # private member access
    "ERA",    # commented-out code
    "LOG",    # logging misuse
    "ICN",    # import conventions
    "INP",    # implicit namespace packages
    "SLOT",   # __slots__ on str/tuple/namedtuple subclasses
    "N",      # pep8 naming
]
ignore = [
    "E501",    # line too long (handled by formatter)
    "TRY003",
]
per-file-ignores = { "tests/**" = ["PLR2004", "ARG001"], "tests/test_cli.py" = ["SLF001"], "stubs/**" = ["ANN401", "I001"] }

[tool.ruff.lint.isort]
known-first-party = ["tcnc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-n", "auto", "--dist=loadscope", "-ra"]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.environment]
python-version = "3.14"
# "." resolves the `tests` package so shared test helpers import as `tests.*`.
root = ["./src", "."]
# svgelements ships ISO-8859-1 source the checkers cannot read; stubs/ declares what tcnc uses.
extra-paths = ["stubs"]

[tool.ty.rules]
missing-type-argument = "error"
possibly-missing-attribute = "error"
possibly-missing-import = "error"
possibly-unresolved-reference = "error"
redundant-cast = "error"
unused-ignore-comment = "error"
unused-type-ignore-comment = "error"

[tool.pyrefly]
min-severity = "warn"
project-includes = ["src", "tests"]
python-version = "3.14"
search-path = ["src", "stubs", "."]
preset = "strict"

[tool.pyrefly.errors]
redundant-cast = "error"
